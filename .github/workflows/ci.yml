name: CI

on:
  push:
    # Catch-all `paths` subtracts instead of selecting: every path matches '**',
    # the negations drop docs, the trailing positives restore gate inputs.
    # ratchet's agent-rules preset reads **/AGENTS.md (rule-file-present,
    # rule-file-max-lines) and docs/plans/** (plan-status-line); skipping CI
    # for those would silently disable those gates. The `paths` form (rather
    # than paths-ignore) is needed for re-inclusion — order is significant.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '**/AGENTS.md'
      - 'docs/plans/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '**/AGENTS.md'
      - 'docs/plans/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install ratchet
        run: |
          curl -fsSL -o /tmp/ratchet \
            https://github.com/all-the-rest/ratchet-cli/releases/download/v0.8.0/ratchet-0.8.0-linux-x86_64
          echo 'bd5a9d77b287c9aed449d20216b6101816e136fce213659e3e04486db06a2326  /tmp/ratchet' | sha256sum -c -
          chmod +x /tmp/ratchet
          sudo mv /tmp/ratchet /usr/local/bin/ratchet
          ratchet --version

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: npm ci

      # Ohne echte Daten (die sind bewusst nicht im Repo) baut der Build mit
      # den leeren *.example.json aus scripts/ensure-data.mjs.
      - name: Verify
        run: npm run verify

      - name: PHP lint
        run: npm run lint:api

      - name: API tests
        run: npm run test:api

      - name: Quality gates
        run: ratchet check --no-ratchet

  # Parallele UI-Screenshots gegen die Live-Instanz. ubuntu-latest hat 4 vCPU;
  # die Config nutzt davon die Haelfte (2 Worker), `nproc` misst sie hier.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Measure runner CPUs
        run: nproc

      - name: Screenshot tests (parallel, no retries)
        env:
          UI_REVIEW_USER: ${{ secrets.UI_REVIEW_USER }}
          UI_REVIEW_PASSWORD: ${{ secrets.UI_REVIEW_PASSWORD }}
        run: npm run test:screenshots
