# LTB-API: PHP-FPM mit SQLite.
#
# Wird von deploy.sh nach /opt/stacks/ltb/compose.yaml installiert. Der
# PHP-Container haengt nur im dedizierten Docker-Netz `ltb-edge`, in dem
# ausschliesslich Caddy und ltb-php liegen; Caddy spricht ihn per FastCGI an.
# Benutzer und Sessions liegen in derselben SQLite-Datenbank wie die Sammlung;
# ein externer Auth-Sidecar ist nicht mehr noetig.
#
# Haertung: ltb-php laeuft als www-data (82:82) ohne Capabilities, mit
# no-new-privileges und read-only Rootfs; /tmp ist die einzige beschreibbare
# Stelle. Der einmalige Init-Container (als root) berechtigt das Datenvolume
# fuer den Deploy: Verzeichnis 0700, Datenbankdateien 0600. Danach kann der
# PHP-Container nicht mehr chownen und nur noch /data beschreiben.
#
# Netz-Isolation (Issue #27): ltb-php ist aus dem geteilten `webnet` entfernt.
# Nur Caddy kann den FastCGI-Port erreichen und damit REMOTE_ADDR setzen; das
# IP-Login-Limit kann nicht mehr von anderen Containern umgangen werden.
# Voraussetzung: das externe Netz `ltb-edge` existiert auf dem Host und der
# Caddy-Stack ist daran angebunden (siehe reisi007/caddyfile).
#
# Der Quellcode liegt unter /home/webadmin/websites/ltb-api (nicht im
# Web-Root), der Seed unter /home/webadmin/websites/ltb-seed. Die Datenbank
# lebt im Volume `ltb_ltb_data` und überlebt Deploys.
services:
  ltb-init:
    image: php:8.3-fpm-alpine
    container_name: ltb-init
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: >
      mkdir -p /data && chown -R 82:82 /data && chmod 700 /data &&
      find /data -maxdepth 1 -type f -exec chmod 600 {} +
    volumes:
      - ltb_data:/data
    restart: "no"

  ltb-php:
    image: php:8.3-fpm-alpine
    container_name: ltb-php
    restart: unless-stopped
    user: "82:82"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # chown kann als Non-Root nicht laufen; das macht ltb-init vorab.
    command: >
      sh -c "exec php-fpm -F -d expose_php=0 -d display_errors=0 -d log_errors=1"
    depends_on:
      ltb-init:
        condition: service_completed_successfully
    environment:
      LTB_DB: /data/ltb.sqlite
      LTB_SEED: /srv/seed/collection.json
      # Optionaler Katalog für GET /api/lookup. Fehlt die Datei, nutzt der
      # Lookup nur die gelernten ISBN-Zuordnungen.
      LTB_CATALOG: /srv/seed/catalog.json
    volumes:
      - /home/webadmin/websites/ltb-api:/srv/api:ro
      - /home/webadmin/websites/ltb-seed:/srv/seed:ro
      - ltb_data:/data
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ltb-edge

volumes:
  ltb_data:

networks:
  ltb-edge:
    external: true
